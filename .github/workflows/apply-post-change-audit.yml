name: Apply post-change Loom audit

on:
  push:
    branches:
      - feat/floc-loom-v0.5
    paths:
      - .github/workflows/apply-post-change-audit.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feat/floc-loom-v0.5
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Apply bounded post-change audit patch
        run: |
          python3 plugins/floc-loom/scripts/apply_post_change_audit.py
          rm plugins/floc-loom/scripts/apply_post_change_audit.py
          rm .github/workflows/apply-post-change-audit.yml

      - name: Run focused ledger tests
        run: python3 -m unittest plugins/floc-loom/scripts/test_ledger.py

      - name: Run ShellCheck
        run: shellcheck plugins/floc-loom/scripts/*.sh

      - name: Run complete repository verifier
        run: sh plugins/floc-loom/scripts/verify.sh

      - name: Validate JSON and working diff
        run: |
          jq empty .agents/plugins/marketplace.json plugins/floc-loom/.codex-plugin/plugin.json
          git diff --check
          git status --short

      - name: Commit verified changes
        run: |
          git config user.name "GsusFC"
          git config user.email "98390545+GsusFC@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(orchestration): close post-change audit gaps"
          git push origin HEAD:feat/floc-loom-v0.5
